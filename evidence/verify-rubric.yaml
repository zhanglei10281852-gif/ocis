rubrics:
  - id: 1
    type: p2p
    text: 不带游标的已认证连接继续实时接收自己的业务事件，认证失败仍被拒绝，keepalive 不携带也不推进业务事件游标。
  - id: 2
    type: f2p
    text: 业务 SSE 帧携带稳定事件标识，携带有效 Last-Event-ID 重连会按确定顺序回放该用户在游标之后的全部保留事件。
  - id: 3
    type: f2p
    text: 回放期间并发到达的实时事件在交接后恰好交付一次，不出现游标与实时订阅之间的缺口、重复或乱序。
  - id: 4
    type: f2p
    text: 同一事件面向多名用户以及多用户同时重连时，历史查询、游标边界和实时流保持用户隔离。
  - id: 5
    type: f2p
    text: 未知、非法或已超出保留期的游标产生可观察的重新同步结果并建立明确的新实时边界，不会被当作成功连续回放。
  - id: 6
    type: f2p
    text: SSE 服务重启后有效游标仍能从持久历史续传；历史服务暂时失败时不发送不完整回放或推进边界，恢复重试保持相同结果。
