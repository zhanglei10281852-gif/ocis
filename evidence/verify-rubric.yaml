rubrics:
  - id: 1
    type: p2p
    text: 正文已经存在的活动继续按现有权限、筛选、排序、数量限制、翻译和响应格式返回。
  - id: 2
    type: f2p
    text: 活动引用先于事件正文落盘时，立即查询不会删除引用；正文随后到达后再次查询会显示该活动。
  - id: 3
    type: f2p
    text: eventhistory 整体不可用、单条暂时读取失败或 HTTP 响应写出失败时，活动引用保持不变且故障可观察。
  - id: 4
    type: f2p
    text: 确定超过保留期或不可恢复损坏的正文会触发对应引用清理，后续查询不再重复处理该失效记录。
  - id: 5
    type: f2p
    text: 并发查询与正文到达交错时，旧的清理判定不能删除已经有效或更新一代的引用，也不会重复返回同一活动。
  - id: 6
    type: f2p
    text: activitylog 或 eventhistory 重启后，待收敛引用、有效活动和确定失效记录仍分别采取保留、展示和清理行为。
