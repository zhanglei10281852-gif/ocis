rubrics:
  - id: 1
    type: p2p
    text: 正常运行时现有移动、删除、恢复、上传和空间改名事件仍更新索引，默认防抖与异步上传选择保持兼容。
  - id: 2
    type: f2p
    text: 事件进入防抖窗口后进程崩溃，重启会只恢复持久记录的待处理空间并使搜索结果收敛，空闲启动不会扫描全部空间。
  - id: 3
    type: f2p
    text: 优雅关闭会完成已开始的空间任务或留下可接管状态，重新启动不会丢失任务或把同一代次并发执行两次。
  - id: 4
    type: f2p
    text: 同一空间的连续事件被合并且带有可比较代次，较早重建完成不能清除其执行期间到达的更新。
  - id: 5
    type: f2p
    text: 空间遍历或索引提交失败会保留待处理状态和可观察错误，只有覆盖该代次的成功重建才能清除状态。
  - id: 6
    type: f2p
    text: 多个消费者或实例竞争以及手动 IndexSpace 与自动恢复交错时，每个代次最多由一个有效执行者提交，最终索引和待处理状态一致。
