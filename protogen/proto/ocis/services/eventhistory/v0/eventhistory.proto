
syntax = "proto3";

package ocis.services.eventhistory.v0;

option go_package = "github.com/owncloud/ocis/protogen/gen/ocis/services/eventhistory/v0";

import "ocis/messages/eventhistory/v0/eventhistory.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "ownCloud Infinite Scale thumbnails";
    version: "1.0.0";
    contact: {
      name: "ownCloud GmbH";
      url: "https://github.com/owncloud/ocis";
      email: "support@owncloud.com";
    };
    license: {
      name: "Apache-2.0";
      url: "https://github.com/owncloud/ocis/blob/master/LICENSE";
    };
  };
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  external_docs: {
    description: "Developer Manual";
    url: "https://owncloud.dev/services/thumbnails/";
  };
};

// A Service for storing events
service EventHistoryService {
    // returns the specified events
    rpc GetEvents(GetEventsRequest) returns (GetEventsResponse);
    // returns all events for the specified userID
    rpc GetEventsForUser(GetEventsForUserRequest) returns (GetEventsResponse);
}

// A request to retrieve events
message GetEventsRequest {
    // the ids of the events we want to get
    repeated string ids = 1;
}

// A request to retrieve events belonging to a userID
message GetEventsForUserRequest {
    // the userID of the events we want to get
    string userID = 1;
}

// The service response
message GetEventsResponse {
    repeated ocis.messages.eventhistory.v0.Event events = 1;
    // the lookup outcome for every requested event id for which no event body
    // could be returned. Allows callers to distinguish events that are still
    // in flight from expired ones and from transient storage failures.
    repeated EventLookupStatus statuses = 2;
}

// EventLookupStatus reports why an event body could not be returned for an id.
message EventLookupStatus {
    // the id of the requested event
    string id = 1;
    // the outcome of the lookup
    EventLookupState state = 2;
}

// EventLookupState describes the outcome of looking up a single event body.
enum EventLookupState {
    // unspecified, unused
    EVENT_LOOKUP_STATE_UNSPECIFIED = 0;
    // no event with the requested id is currently stored; the event body may
    // still be on its way into the store or may have expired
    EVENT_LOOKUP_STATE_NOT_FOUND = 1;
    // the stored event payload is corrupt and cannot be decoded, the record
    // is considered permanently lost
    EVENT_LOOKUP_STATE_CORRUPT = 2;
    // reading the event failed because of a transient storage backend error,
    // the event must be considered potentially available
    EVENT_LOOKUP_STATE_READ_FAILED = 3;
}
